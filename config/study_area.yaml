  "01": Salawin
  "02": North Khong
  "06": Ping
  "07": Wang
  "08": Yom
  "09": Nan
ping_headwater_subbasins: ["0601", "0602", "0603", "0604", "0605", "0606"]   # above Chiang Mai city
